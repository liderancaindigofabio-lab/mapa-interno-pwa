name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'manifest.webmanifest'
      - 'app-icon-192.png'
      - 'app-icon-512.png'
      - 'icon.svg'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Launch APK and capture Android logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86
          profile: pixel_2
          script: |
            set +e
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n br.com.huse.mapainterno.fixed/br.com.huse.mapainterno.MainActivity
            sleep 10
            adb shell dumpsys activity activities > /tmp/huse-activities.txt
            adb logcat -d -t 800 > /tmp/huse-logcat.txt
            echo '--- Activity state ---'
            grep -E 'mResumedActivity|mFocusedActivity|diagnostic' /tmp/huse-activities.txt | tail -40 || true
            echo '--- Android/WebView crash messages ---'
            grep -Ei 'FATAL EXCEPTION|AndroidRuntime|chromium|WebView|crash|Process .* has died' /tmp/huse-logcat.txt | tail -100 || true
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: mapa-interno-huse-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
