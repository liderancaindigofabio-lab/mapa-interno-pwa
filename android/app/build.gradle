plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.huse.mapainterno'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.huse.mapainterno'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debugfix1'
            versionNameSuffix '-debugfix1'
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
